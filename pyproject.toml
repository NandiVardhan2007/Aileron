[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aileron"
version = "0.1.0rc1"
description = "Touchless air-mouse and simulator controller driven by MediaPipe hand tracking."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "mediapipe>=0.10",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pynput>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aileron"]

[project.optional-dependencies]
gamepad-windows = ["vgamepad>=0.1; sys_platform == 'win32'"]
ui              = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aileron = "aileron.__main__:main"

[project.entry-points."aileron.backends"]
null = "aileron.output.null:NullBackend"
windows = "aileron.output.windows:WindowsMouseKeyboardBackend"
vgamepad = "aileron.output.gamepad:VGamepadBackend"
keyboard_pwm = "aileron.output.gamepad:KeyboardPwmGamepad"

[project.entry-points."aileron.gestures"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PL", "RUF", "ANN"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN", "S101", "D"]
"tools/**" = ["PLR2004", "ANN", "PLR0912", "PLR0915", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pynput.*", "vgamepad.*", "vgamepad"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["safety: safety-critical tests that may never be skipped", "manual: needs camera or OS input"]
